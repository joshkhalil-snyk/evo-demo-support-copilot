# Temporary: checks the doc's region step. Not for main.
name: Region step check
on:
  pull_request:
jobs:
  region:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: snyk/actions/setup@master
      - name: Without --no-check
        continue-on-error: true
        run: snyk config environment SNYK-EU-01
      - name: With --no-check
        run: snyk config environment SNYK-EU-01 --no-check && snyk config get endpoint
