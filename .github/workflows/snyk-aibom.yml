name: Snyk AI-BOM
on:
  push:
    branches: [main]
  pull_request:
jobs:
  aibom:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG_ID: ${{ vars.SNYK_ORG_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: AI-BOM policy test
        continue-on-error: true
        run: snyk aibom test --org="$SNYK_ORG_ID" --severity-threshold=high
      - name: Upload AI-BOM to Evo
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: snyk aibom --upload --repo "${{ github.server_url }}/${{ github.repository }}" --org="$SNYK_ORG_ID"
